name: tests

# Paused while the repository is private (runs there use the account's Actions minutes):
# it runs only when started by hand (Actions tab > tests > Run workflow). To run it on
# every push again, replace the trigger with:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]     # 3.12 as in the solver container
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pydantic "mujoco>=4.0.1" "mcp>=2.3,<3" ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (host side; solver tests skip without FEniCSx)
        run: python -m pytest -q
