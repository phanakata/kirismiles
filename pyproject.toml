# The code is used from a checkout (see README). `pip install -e .` installs its host-side
# dependencies and the `kirismiles` command; the solver runs in the FEniCSx Docker image.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kirismiles"
version = "0.2.1"
description = "A line notation and open platform for kirigami design, simulation, and AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest", "ruff", "mypy", "pydantic", "mcp>=2.3,<3"]
mujoco = ["mujoco>=4.0.1"]

[project.scripts]
kirismiles = "kirigami.cli:main"

[project.urls]
Repository = "https://github.com/phanakata/kirismiles"

[tool.setuptools]
packages = ["kirigami"]                # scripts/, webapp/, mcp_server/ stay in the checkout

[tool.pytest.ini_options]
testpaths = ["tests"]                # scripts/smoke_test.py etc. need the FEniCSx solver
pythonpath = ["."]
addopts = "-ra"                      # list why each test was skipped or xfailed

[tool.ruff]
line-length = 120
target-version = "py312"             # the solver container runs Python 3.12
extend-exclude = ["build", "results", "paper", "docs", "collective"]

[tool.ruff.lint]
# pyflakes (F), syntax and statement errors (E4, E7, E9) and whitespace (W).
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E702",   # several statements on a line: kept on purpose in compact plotting code
    "E731",   # small lambdas assigned to names
    "E741",   # l, I, O as variable names, as in the equations
]

[tool.mypy]
# Modules with complete type hints; add a module here once it is typed.
files = [
    "kirigami/_types.py",
    "kirigami/grammar.py",
    "kirigami/kirismiles.py",
    "kirigami/spec.py",
    "kirigami/api.py",
    "kirigami/kdb.py",
    "kirigami/mjcf.py",
    "kirigami/geometry.py",
    "kirigami/export.py",
    "kirigami/strain.py",
    "kirigami/fvk.py",
    "kirigami/shell.py",
    "kirigami/tube.py",
    "kirigami/jobs.py",
    "kirigami/importer.py",
    "kirigami/provenance.py",
    "webapp/server.py",
    "mcp_server/server.py",
    "kirigami/argtypes.py",
    "kirigami/cli.py",
    "scripts/kirigami_cli.py",
    "scripts/make_gif.py",
    "scripts/compare_designs.py",
    "scripts/export_mujoco.py",
    "scripts/mujoco_check.py",
    "scripts/mujoco_gif.py",
    "scripts/mujoco_figure.py",
    "scripts/check_strings.py",
    "scripts/corpus.py",
    "scripts/build_kdb.py",
    "scripts/run_config.py",
    "scripts/build_pitch_roll.py",
]
python_version = "3.12"
plugins = ["pydantic.mypy"]          # Field defaults and validators of kirigami/kdb.py
explicit_package_bases = true         # webapp/server.py and mcp_server/server.py are two modules
mypy_path = "."
ignore_missing_imports = true        # dolfinx, gmsh, mujoco have no stubs here
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
